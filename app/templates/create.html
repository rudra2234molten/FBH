{% extends "main.html" %}
{% block content %}
<section class="create_acc_main_container all_forms"><br><br><br><br><br><br>
  <h1>Create Account</h1>
  <form action="" method="post" class="flex">
    {% csrf_token %}
    <label for="name">Name
    </label>
    <input type="text" placeholder="Enter Your Name" name="name" id="name">
    <label for="mail">Gmail</label>
    <input type="email" name="mail" id="mail" placeholder="Enter Your Mail-Id" inputmode="email">
    <label for="dob">DOB
    </label>
    <input type="date" name="dob" id="dob" placeholder="Enter Your Date Of Birth">
    <label for="adhar">Adhar
    </label>
    <input type="number" name="adhar" id="adhar" placeholder="Enter Your Adhar Number" inputmode="numeric">
    <label for="pan">Pan
    </label>
    <input type="number" name="pan" id="pan" placeholder="Enter Your Pan Number" inputmode="numeric">
    <label for="phone">Mobile
    </label>
    <input type="number" name="phone" id="phone" placeholder="Enter Your Phone Number" inputmode="numeric">
    <label for="address">Address
    </label>
    <input type="text" name="address" id="address" placeholder="Enter Your Address">
    <button type="submit">CREATE</button>
  </form>
</section>
{% endblock content %}
